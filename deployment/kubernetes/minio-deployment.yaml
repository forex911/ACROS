apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: sentinel-storage
spec:
  selector:
    app: minio
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: sentinel-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2023-03-16T00-00-00Z
          args:
            - server
            - /data
          envFrom:
            - secretRef:
                name: sentinel-backend-secrets
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes: []

---
# Optional: bucket bootstrap Job to create buckets and apply lifecycle policies
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: sentinel-storage
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc
          envFrom:
            - secretRef:
                name: sentinel-backend-secrets
          command: ["/bin/sh", "-c"]
          args:
            - |
              mc alias set local ${S3_ENDPOINT} ${S3_ACCESS_KEY} ${S3_SECRET_KEY} --api S3v4 || true
              mc mb --ignore-existing local/${S3_BUCKET} || true
              # set lifecycle rules example: delete after 30 days (adjust as needed)
              cat <<EOF > /tmp/lifecycle.json
              {
                "Rules": [
                  {
                    "ID": "auto-expire-30d",
                    "Status": "Enabled",
                    "Expiration": {"Days": 30}
                  }
                ]
              }
              EOF
              mc ilm import local/${S3_BUCKET} /tmp/lifecycle.json || true
      serviceAccountName: sentinel-backend-sa
