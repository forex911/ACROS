apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-worker
  namespace: sentinel-workers
  labels:
    app: sentinel-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-worker
  template:
    metadata:
      labels:
        app: sentinel-worker
    spec:
      serviceAccountName: sentinel-worker-sa
      containers:
        - name: worker
          image: sentinel/sandbox-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: sentinel-worker-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          # Liveness/readiness probes help K8s recover unhealthy pods
          livenessProbe:
            httpGet:
              path: /health
              port: 6000
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 6000
            initialDelaySeconds: 10
            periodSeconds: 10

---
# KEDA ScaledObject - scales Deployment based on Redis list length (Celery queue)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sentinel-worker-scaledobject
  namespace: sentinel-workers
spec:
  scaleTargetRef:
    name: sentinel-worker
  pollingInterval: 30  # seconds
  cooldownPeriod:  300
  minReplicaCount: 1
  maxReplicaCount: 20
  triggers:
    - type: redis
      metadata:
        address: "${REDIS_URL}"
        listName: "celery"
        listLength: "10"
        # If your celery queue uses a named list or different key, adjust listName
