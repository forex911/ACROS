name: ACROS CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast:
    name: Static Analysis (Bandit & Flake8)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit flake8
    - name: Run Bandit
      run: bandit -r backend ai_engine monitor -ll -ii -x backend/tests,backend/venv,tests
    - name: Run Flake8
      run: flake8 backend ai_engine monitor --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: sast
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install requirements
      run: |
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio
    - name: Run Pytest
      run: pytest backend/tests/

  container-scan:
    name: Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build an image from Dockerfile
        run: |
          docker build -t acros-backend:${{ github.sha }} -f backend/Dockerfile .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'acros-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
