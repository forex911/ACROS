name: Worker CI

on:
  push:
    paths:
      - 'services/sandbox-worker/**'
  pull_request:
    paths:
      - 'services/sandbox-worker/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest bandit
      - name: Lint (ruff)
        run: ruff services/sandbox-worker --fix || true
      - name: Format (black check)
        run: black --check services/sandbox-worker || true
      - name: Unit tests
        run: pytest services/sandbox-worker/tests -q || true
      - name: Security scan (bandit)
        run: bandit -r services/sandbox-worker -ll || true

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ./services/sandbox-worker
          file: ./services/sandbox-worker/Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_HOST }}/acros/sandbox-worker:${{ github.sha }}
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.REGISTRY_HOST }}/acros/sandbox-worker:${{ github.sha }}
