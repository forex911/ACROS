name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:latest
        env:
          NEO4J_AUTH: neo4j/password
          NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474/db/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 7687:7687
          - 7474:7474
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          sed -i 's/python-magic-bin==0.4.14/python-magic==0.4.27/' backend/requirements.txt
          pip install -r backend/requirements.txt
          pip install ruff black pytest bandit
      - name: Lint (ruff)
        run: ruff backend --fix || true
      - name: Format (black check)
        run: black --check backend || true
      - name: Unit tests
        run: pytest backend/tests -q
      - name: Security scan (bandit)
        run: bandit -r backend -ll -x backend/tests,backend/venv

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger ArgoCD sync (optional)
        run: |
          echo "Triggering ArgoCD sync..."
          if [ -z "${{ secrets.ARGOCD_SERVER }}" ]; then
            echo "ArgoCD secrets not configured. Skipping deploy."
            exit 0
          fi
          curl -k -s -X POST "${{ secrets.ARGOCD_SERVER }}/api/v1/applications/acros-backend/sync" \
            -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" || true
