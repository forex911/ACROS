name: Helm & Kustomize CI

on:
  push:
    paths:
      - 'charts/**'
      - 'deployment/kubernetes/**'
  pull_request:
    paths:
      - 'charts/**'
      - 'deployment/kubernetes/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSfLo kubeconform https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64
          chmod +x kubeconform && sudo mv kubeconform /usr/local/bin/
      - name: Lint Helm chart
        run: helm lint charts/acros-platform
      - name: Kubeconform validate manifests
        run: |
          kustomize build deployment/kubernetes/k8s/overlays/dev | kubeconform -summary -strict
      - name: Generate manifests
        run: kustomize build deployment/kubernetes/k8s/overlays/dev > manifests.yaml
          
      - name: Kube-score Action
        uses: zegl/kube-score-action@v1
        with:
          manifests: manifests.yaml
