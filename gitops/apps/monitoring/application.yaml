apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel-monitoring-dev
  namespace: argocd
spec:
  project: sentinel-project
  source:
    repoURL: "REPLACE_WITH_REPO"
    targetRevision: HEAD
    path: deployment/kubernetes/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: sentinel-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
