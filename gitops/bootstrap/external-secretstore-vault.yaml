apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: sentinel-backend
spec:
  provider:
    vault:
      server: "https://vault.example.internal:8200" # REPLACE
      path: "secret/data"
      version: "v2"
      auth:
        token:
          secretRef:
            name: vault-token
            key: token

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-credentials
  namespace: sentinel-backend
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: minio-credentials
    creationPolicy: Owner
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: minio
        property: access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: minio
        property: secret_key
