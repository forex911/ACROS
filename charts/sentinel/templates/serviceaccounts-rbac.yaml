---
# -----------------------------------------------------------------------------
# Namespaces
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: sentinel-backend
---
apiVersion: v1
kind: Namespace
metadata:
  name: sentinel-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted

---
# -----------------------------------------------------------------------------
# Service Accounts
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-backend-sa
  namespace: sentinel-backend
  annotations:
    description: "Used by the main FastAPI servers"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-worker-sa
  namespace: sentinel-backend
  annotations:
    description: "Used by Celery workers to launch sandbox Jobs"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-sandbox-sa
  namespace: sentinel-sandbox
  annotations:
    description: "Used by the ephemeral gVisor sandbox pods. Very restricted."

---
# -----------------------------------------------------------------------------
# RBAC: Allow Celery Workers to create/manage Jobs in sentinel-sandbox ONLY
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-manager-role
  namespace: sentinel-sandbox
rules:
  - apiGroups: ["batch", "extensions"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worker-sandbox-manager-binding
  namespace: sentinel-sandbox
subjects:
  - kind: ServiceAccount
    name: sentinel-worker-sa
    namespace: sentinel-backend
  - kind: ServiceAccount
    name: sentinel-backend-sa
    namespace: sentinel-backend
roleRef:
  kind: Role
  name: sandbox-manager-role
  apiGroup: rbac.authorization.k8s.io

---
# -----------------------------------------------------------------------------
# RBAC: Restrict Sandbox Pods from accessing the Kubernetes API entirely
# -----------------------------------------------------------------------------
# By default, a SA can't do much, but we explicitly bind it to a role with no
# permissions just to be safe, and we rely on automountServiceAccountToken: false
# in the PodSpec.
