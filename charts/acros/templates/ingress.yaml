apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ACROS-ingress
  namespace: acros-backend # NGINX often requires ingress in the same namespace as services, but cross-namespace is possible depending on setup
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/websocket-services: "acros-backend"
spec:
  rules:
    - host: ACROS.local
      http:
        paths:
          # Backend API and WebSockets
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: acros-backend
                port:
                  number: 80
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: acros-backend
                port:
                  number: 80
          # Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ACROS-frontend
                port:
                  number: 80
