apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: aegis-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: aegis-backend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-pdb
  namespace: aegis-workers
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: aegis-worker
