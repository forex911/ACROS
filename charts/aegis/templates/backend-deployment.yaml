apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-backend
  namespace: aegis-backend
  labels:
    app: aegis-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis-backend
  template:
    metadata:
      labels:
        app: aegis-backend
    spec:
      serviceAccountName: aegis-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: aegis/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: aegis-backend-secrets
            - configMapRef:
                name: aegis-backend-config
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

---
apiVersion: v1
kind: Service
metadata:
  name: aegis-backend
  namespace: aegis-backend
spec:
  selector:
    app: aegis-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-backend-config
  namespace: aegis-backend
data:
  UPLOAD_DIR: "/tmp/uploads"
  LOG_LEVEL: "INFO"

---
apiVersion: v1
kind: Secret
metadata:
  name: aegis-backend-secrets
  namespace: aegis-backend
type: Opaque
stringData:
  # Replace values with secrets (do not commit real credentials)
  MONGO_URI: "mongodb://mongo-0.mongo-svc.aegis-storage.svc.cluster.local:27017"
  REDIS_URL: "redis://redis.aegis-storage.svc.cluster.local:6379/0"
  CELERY_BROKER_URL: "redis://redis.aegis-storage.svc.cluster.local:6379/0"
  S3_ENDPOINT: "http://minio.aegis-storage:9000"
  S3_ACCESS_KEY: "minio"
  S3_SECRET_KEY: "minio123"
  S3_BUCKET: "uploads"
